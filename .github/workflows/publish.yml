
name: Publish WarehouseAccounting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore WarehouseAccounting.csproj

      - name: Publish
        run: dotnet publish WarehouseAccounting.csproj -c Release -o publish

      - name: Upload publish files
        uses: actions/upload-artifact@v4
        with:
          name: WarehouseAccounting-Publish
          path: publish/
