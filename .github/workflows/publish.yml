
name: Publish WarehouseAccounting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore WarehouseAccounting.csproj

      - name: Publish
        run: dotnet publish WarehouseAccounting.csproj -c Release -o ./publish -r win-x86

